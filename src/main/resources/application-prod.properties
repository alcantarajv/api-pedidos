# Perfil de producao.
#
# O grupo declarado em application.properties (spring.profiles.group.prod=docker)
# faz o perfil "docker" tambem ficar ativo: log estruturado em JSON e health sem
# detalhes vem de la. Aqui ficam so as diferencas de producao.

# --- RabbitMQ gerenciado (CloudAMQP) ---
# Uma URL AMQP unica, com credenciais e vhost embutidos, em vez de host, porta,
# usuario e senha separados. Quando definida, ela tem precedencia sobre as
# propriedades individuais.
#
# O Render nao oferece RabbitMQ gerenciado no plano gratuito; o CloudAMQP
# oferece, e a aplicacao nao precisa saber a diferenca — e a vantagem de o
# broker ser configuracao, nao codigo.
spring.rabbitmq.addresses=${RABBITMQ_URL}

# O plano gratuito do CloudAMQP limita conexoes simultaneas (20 no Little Lemur).
# Publicador e listeners abrem conexoes proprias; este limite evita que um pico
# esgote a cota e derrube a conexao de todo mundo.
spring.rabbitmq.cache.channel.size=10
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=2

# --- Banco (Neon) ---
# A instancia gratuita do Render tem 512 MB e o plano gratuito do Neon limita as
# conexoes simultaneas. Cinco sobram para o volume de um portfolio, e o pool
# cheio nunca fica sendo o gargalo antes da memoria.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# O Neon suspende o banco depois de alguns minutos ocioso. A primeira conexao
# seguinte espera ele acordar, o que passa dos 3 segundos que valem localmente.
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:10000}

# --- Worker do outbox ---
# Intervalo um pouco maior que o local: a instancia gratuita hiberna quando
# ociosa, e consultar o banco a cada segundo so para encontrar zero pendentes
# gasta a cota de computacao sem entregar nada.
pedidos.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:5000}
