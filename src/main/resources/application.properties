spring.application.name=pedidos

# Plataformas de deploy injetam a porta por variavel de ambiente e esperam que a
# aplicacao a respeite. Sem isto, o servico sobe na 8080, a plataforma procura em
# outra porta, o health check falha e o deploy e revertido.
server.port=${PORT:8080}

# --- Banco ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pedidos}
spring.datasource.username=${DB_USERNAME:pedidos}
spring.datasource.password=${DB_PASSWORD:pedidos}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:3000}

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:pedidos}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:pedidos}

# Confirmacao de publicacao pelo broker, em modo correlacionado. E o que permite
# ao worker do outbox saber que a mensagem chegou ao RabbitMQ antes de marcar a
# linha como entregue. Sem isto, "publiquei" significa apenas "escrevi no socket"
# e o evento poderia ser perdido sem ninguem notar.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# --- JPA ---
# O schema e responsabilidade exclusiva do Flyway; o Hibernate apenas valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Aplicacao inteira em UTC, independente do fuso da maquina ---
spring.jackson.time-zone=UTC

# --- Problem Details (RFC 9457) nas respostas de erro ---
spring.mvc.problemdetails.enabled=true

# --- Actuator ---
# O health agrega automaticamente o estado do banco e do RabbitMQ. Como este
# projeto depende dos dois, "a aplicacao esta de pe" so e verdade se ambos
# estiverem respondendo. A lista de endpoints expostos esta em Observabilidade.
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${HEALTH_DETAILS:always}

# --- JWT (segredo sempre por variavel de ambiente) ---
# Sem valor padrao de proposito: a aplicacao se recusa a subir sem JWT_SECRET,
# porque um segredo embutido no repositorio permitiria forjar token de ADMIN.
pedidos.jwt.segredo=${JWT_SECRET:}
pedidos.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}
pedidos.jwt.emissor=pedidos-api

# --- Admin inicial (opcional) ---
# Sem estas variaveis definidas, nenhum admin e criado no boot. Tambem sem valor
# padrao: sistema que sobe com credencial de administrador conhecida e como
# instalacao de exemplo acaba invadida.
pedidos.admin-inicial.nome=${ADMIN_INICIAL_NOME:Administrador}
pedidos.admin-inicial.email=${ADMIN_INICIAL_EMAIL:}
pedidos.admin-inicial.senha=${ADMIN_INICIAL_SENHA:}

# --- Perfis ---
# O perfil "prod" herda tudo do "docker". Em vez de repetir as mesmas linhas num
# application-prod.properties, o grupo faz o prod incluir o docker.
spring.profiles.group.prod=docker

# --- Gateway de pagamento ---
# A URL e configuravel para que os testes apontem para o WireMock, e para que um
# sandbox alternativo nao exija recompilar.
pedidos.gateway.url=${GATEWAY_URL:https://api.stripe.com}
pedidos.gateway.chave-api=${STRIPE_API_KEY:}

# Timeouts explicitos: o padrao do cliente HTTP e nao ter nenhum. Um gateway que
# aceita a conexao e nunca responde prenderia a thread da requisicao
# indefinidamente; algumas dessas e o pool do Tomcat acaba, e a API inteira para
# de responder por causa de um fornecedor lento.
pedidos.gateway.timeout-de-conexao=${GATEWAY_TIMEOUT_CONEXAO:3s}
pedidos.gateway.timeout-de-leitura=${GATEWAY_TIMEOUT_LEITURA:10s}
# Segredo do webhook (whsec_...). E diferente da chave da API e tem finalidade
# oposta: a chave prova quem somos ao gateway; este prova que quem chamou o
# nosso endpoint foi o gateway.
pedidos.gateway.segredo-do-webhook=${STRIPE_WEBHOOK_SECRET:}
# Janela em que uma assinatura continua aceitavel. Protege contra reenvio de uma
# requisicao valida capturada antes.
pedidos.gateway.tolerancia-do-webhook=${GATEWAY_TOLERANCIA_WEBHOOK:5m}

# --- Outbox ---
pedidos.outbox.intervalo-ms=${OUTBOX_INTERVALO_MS:1000}
pedidos.outbox.tamanho-do-lote=${OUTBOX_LOTE:50}
pedidos.outbox.timeout-de-confirmacao=${OUTBOX_TIMEOUT_CONFIRMACAO:5s}

# A mensagem precisa voltar quando nao houver fila para ela; sem isto, o broker
# a descarta em silencio e o worker marcaria o evento como entregue.
spring.rabbitmq.template.mandatory=true

# --- Consumidores ---
# Retentativa dentro do proprio consumidor, com espera crescente: a maioria das
# falhas e momentanea (banco ocupado, lock), e reprocessar em seguida resolve.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2

# Esgotadas as tentativas, a mensagem NAO volta para a fila: vai para a fila de
# mortas. Sem isto, uma mensagem que sempre falha volta para o fim da fila e
# gira para sempre, consumindo o consumidor e atrasando todas as outras.
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Uma mensagem por vez, confirmada apos o processamento. O padrao (prefetch 250)
# entregaria um bloco inteiro ao consumidor; se ele morresse no meio, o bloco
# voltaria para a fila e seria reprocessado — funciona porque o consumo e
# idempotente, mas com prefetch 1 o desperdicio e menor.
spring.rabbitmq.listener.simple.prefetch=1

# --- Expiracao de pedidos nao pagos ---
# Politica comercial, nao numero tecnico: curto demais irrita quem foi buscar o
# cartao, longo demais mantem estoque preso a pedido que ninguem vai pagar.
pedidos.expiracao.prazo=${EXPIRACAO_PRAZO:30m}
pedidos.expiracao.intervalo-ms=${EXPIRACAO_INTERVALO_MS:60000}
pedidos.expiracao.tamanho-do-lote=${EXPIRACAO_LOTE:100}

# --- Limpeza de registros de idempotencia ---
# Passada a janela de retentativa do gateway e do broker, guardar o registro
# deixa de ter proposito: ninguem vai reentregar um evento de trinta dias atras.
pedidos.limpeza.retencao=${LIMPEZA_RETENCAO:30d}
pedidos.limpeza.intervalo-ms=${LIMPEZA_INTERVALO_MS:3600000}

# --- Observabilidade ---
# Prometheus entra na exposicao; o health continua publico e o resto fechado.
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Percentis e histograma das requisicoes HTTP. Media esconde justamente o que
# importa: a media pode estar otima com 5% dos clientes esperando dez segundos.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.95,0.99

# Toda metrica sai marcada com a aplicacao, para conviver com outras no mesmo
# Prometheus sem virar soma de coisas diferentes.
management.observations.key-values.aplicacao=pedidos

# O id de correlacao aparece em toda linha de log, sem ninguem precisar
# menciona-lo em cada chamada de log.info.
logging.pattern.correlation=[${spring.application.name:}:%X{correlacaoId:-}] 
logging.include-application-name=false

# --- OpenAPI / Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# Endpoints agrupados por tag e ordenados, em vez da ordem de descoberta do
# springdoc, que muda entre execucoes e deixa a pagina imprevisivel.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
# Nao expande os schemas por padrao: a pagina abre legivel em vez de um paredao.
springdoc.swagger-ui.default-models-expand-depth=0
