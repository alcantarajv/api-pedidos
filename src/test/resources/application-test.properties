# Perfil "test", ativado por @TesteDeIntegracao.
#
# ATENCAO: este arquivo se chama application-test.properties, e nao
# application.properties, de proposito. Um application.properties em
# src/test/resources SUBSTITUI o de src/main/resources no classpath — ele nao se
# soma a ele. Toda propriedade definida no principal voltaria ao default, e os
# testes falhariam por um motivo que nada tem a ver com o que estao verificando.
#
# Como perfil, o arquivo do main e carregado normalmente e este apenas sobrepoe
# o que precisa mudar.

# Segredo fixo e sem valor real, exclusivo dos testes. O segredo de producao vem
# de variavel de ambiente e nunca entra no repositorio.
pedidos.jwt.segredo=segredo-apenas-para-testes-com-mais-de-32-caracteres

logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN

# Chave falsa: os testes falam com o WireMock, nao com o Stripe. A URL e
# sobrescrita em tempo de execucao por cada teste, com a porta do servidor falso.
pedidos.gateway.chave-api=sk_test_chave_falsa_de_teste
pedidos.gateway.timeout-de-leitura=1s
